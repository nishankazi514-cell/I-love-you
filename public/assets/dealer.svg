<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c451" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#f5c451" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#05010a"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1a5e"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="50%" stop-color="#f5c451"/>
      <stop offset="100%" stop-color="#b8862a"/>
    </linearGradient>
  </defs>

  <!-- Halo behind -->
  <circle cx="150" cy="170" r="140" fill="url(#halo)"/>

  <!-- Body / Suit -->
  <path d="M55 340 Q55 230 95 205 L205 205 Q245 230 245 340 Z" fill="url(#suit)"/>
  <path d="M95 205 L150 260 L205 205 L205 240 L150 290 L95 240 Z" fill="url(#shirt)" opacity="0.6"/>
  <path d="M95 205 L150 260 L205 205" stroke="url(#gold)" stroke-width="2" fill="none"/>
  <path d="M150 260 L150 340" stroke="url(#gold)" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- Neck -->
  <rect x="132" y="180" width="36" height="35" rx="10" fill="#e8c39b"/>

  <!-- Head -->
  <circle cx="150" cy="140" r="55" fill="#f0cda6"/>
  <circle cx="150" cy="140" r="55" fill="none" stroke="#00000022" stroke-width="1"/>

  <!-- Hair -->
  <path d="M97 135 Q100 78 150 78 Q200 78 203 135 Q200 105 150 100 Q100 105 97 135 Z" fill="#1a1018"/>
  <path d="M100 130 Q110 90 150 90 Q190 90 200 130" fill="none" stroke="#3a1a3a" stroke-width="2"/>

  <!-- Ears -->
  <ellipse cx="97" cy="145" rx="7" ry="12" fill="#e8c39b"/>
  <ellipse cx="203" cy="145" rx="7" ry="12" fill="#e8c39b"/>

  <!-- Eyes -->
  <ellipse cx="130" cy="138" rx="6" ry="7" fill="#fff"/>
  <ellipse cx="170" cy="138" rx="6" ry="7" fill="#fff"/>
  <circle cx="130" cy="139" r="3" fill="#1a1a1a"/>
  <circle cx="170" cy="139" r="3" fill="#1a1a1a"/>
  <circle cx="131" cy="138" r="1" fill="#fff"/>
  <circle cx="171" cy="138" r="1" fill="#fff"/>

  <!-- Brows -->
  <path d="M120 126 Q130 122 140 126" stroke="#3a1a10" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M160 126 Q170 122 180 126" stroke="#3a1a10" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M150 140 L146 158 Q150 162 154 158 Z" fill="#d9a878" opacity="0.8"/>

  <!-- Smile -->
  <path d="M132 170 Q150 184 168 170" stroke="#8a3a2a" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Bow tie -->
  <path d="M135 205 L150 218 L165 205 L165 220 L150 232 L135 220 Z" fill="url(#gold)"/>

  <!-- Vest gold trim -->
  <path d="M95 205 L150 260 L205 205" stroke="url(#gold)" stroke-width="2.5" fill="none"/>

  <!-- Gold collar accent -->
  <path d="M110 205 Q150 240 190 205" stroke="url(#gold)" stroke-width="2" fill="none" opacity="0.8"/>
</svg>
